# Configuration for telegraf agent
[agent]
  ## Default data collection interval for all inputs
  interval = "10s"
  ## Rounds collection interval to 'interval'
  ## ie, if interval="10s" then always collect on :00, :10, :20, etc.
  round_interval = true

  ## Telegraf will send metrics to outputs in batches of at most
  ## metric_batch_size metrics.
  ## This controls the size of writes that Telegraf sends to output plugins.
  metric_batch_size = 1000

  ## Maximum number of unwritten metrics per output.  Increasing this value
  ## allows for longer periods of output downtime without dropping metrics at the
  ## cost of higher maximum memory usage.
  metric_buffer_limit = 10000

  ## Collection jitter is used to jitter the collection by a random amount.
  ## Each plugin will sleep for a random time within jitter before collecting.
  ## This can be used to avoid many plugins querying things like sysfs at the
  ## same time, which can have a measurable effect on the system.
  collection_jitter = "0s"

  ## Default flushing interval for all outputs. Maximum flush_interval will be
  ## flush_interval + flush_jitter
  flush_interval = "10s"
  ## Jitter the flush interval by a random amount. This is primarily to avoid
  ## large write spikes for users running a large number of telegraf instances.
  ## ie, a jitter of 5s and interval 10s means flushes will happen every 10-15s
  flush_jitter = "0s"

  ## By default or when set to "0s", precision will be set to the same
  ## timestamp order as the collection interval, with the maximum being 1s.
  ##   ie, when interval = "10s", precision will be "1s"
  ##       when interval = "250ms", precision will be "1ms"
  ## Precision will NOT be used for service inputs. It is up to each individual
  ## service input to set the timestamp at the appropriate precision.
  ## Valid time units are "ns", "us" (or "µs"), "ms", "s".
  precision = ""

  ## Log at debug level.
  # debug = false
  ## Log only error level messages.
  # quiet = false

  ## Log target controls the destination for logs and can be one of "file",
  ## "stderr" or, on Windows, "eventlog".  When set to "file", the output file
  ## is determined by the "logfile" setting.
  # logtarget = "file"

  ## Name of the file to be logged to when using the "file" logtarget.  If set to
  ## the empty string then logs are written to stderr.
  # logfile = ""

  ## The logfile will be rotated after the time interval specified.  When set
  ## to 0 no time based rotation is performed.  Logs are rotated only when
  ## written to, if there is no log activity rotation may be delayed.
  # logfile_rotation_interval = "0d"

  ## The logfile will be rotated when it becomes larger than the specified
  ## size.  When set to 0 no size based rotation is performed.
  # logfile_rotation_max_size = "0MB"

  ## Maximum number of rotated archives to keep, any older logs are deleted.
  ## If set to -1, no archives are removed.
  # logfile_rotation_max_archives = 5

  ## Pick a timezone to use when logging or type 'local' for local time.
  ## Example: America/Chicago
  # log_with_timezone = ""

  ## Override default hostname, if empty use os.Hostname()
  hostname = ""
  ## If set to true, do no set the "host" tag in the telegraf agent.
  omit_hostname = false

[[outputs.influxdb_v2]]
  ## The URLs of the InfluxDB cluster nodes.
  ##
  ## Multiple URLs can be specified for a single cluster, only ONE of the
  ## urls will be written to each interval.
  ##   ex: urls = ["https://us-west-2-1.aws.cloud2.influxdata.com"]
  urls = ["https://<INFLUXDB_URL>"]

  ## Token for authentication.
  token = "$INFLUX_TOKEN"

  ## Organization is the name of the organization you wish to write to; must exist.
  organization = "<INFLUXDB_ORG>"

  ## Destination bucket to write into.
  bucket = "<INFLUXDB_BUCKET>"

  ## The value of this tag will be used to determine the bucket.  If this
  ## tag is not set the 'bucket' option is used as the default.
  # bucket_tag = ""

  ## If true, the bucket tag will not be added to the metric.
  # exclude_bucket_tag = false

  ## Timeout for HTTP messages.
  # timeout = "5s"

  ## Additional HTTP headers
  # http_headers = {"X-Special-Header" = "Special-Value"}

  ## HTTP Proxy override, if unset values the standard proxy environment
  ## variables are consulted to determine which proxy, if any, should be used.
  # http_proxy = "http://corporate.proxy:3128"

  ## HTTP User-Agent
  # user_agent = "telegraf"

  ## Content-Encoding for write request body, can be set to "gzip" to
  ## compress body or "identity" to apply no encoding.
  # content_encoding = "gzip"

  ## Enable or disable uint support for writing uints influxdb 2.0.
  # influx_uint_support = false

  ## Optional TLS Config for use on HTTP connections.
  # tls_ca = "/etc/telegraf/ca.pem"
  # tls_cert = "/etc/telegraf/cert.pem"
  # tls_key = "/etc/telegraf/key.pem"
  ## Use TLS but skip chain & host verification
  # insecure_skip_verify = false

# Collect statistics about itself
[[inputs.internal]]
  ## If true, collect telegraf memory stats.
  # collect_memstats = true

#############################################
## START
#############################################


#############################################
## SNMP - UPS STATUS & BATTERY (fast poll)
## Everything that can change within seconds
## during a mains-loss event: operating mode,
## load, battery state of charge/voltage/
## current/runtime, elapsed time on battery,
## and active alarm count.
#############################################
[[inputs.snmp]]
  ## UPS network management card (HP AF465A) connection details
  agents = ["10.50.20.3:161"]
  version = 3

  ## SNMPv3 authentication (no privacy/encryption configured on the device)
  sec_name = "readuser"
  sec_level = "authNoPriv"
  auth_protocol = "MD5"
  auth_password = "$UPS_SNMP_AUTH_PASSWORD"

  ## Timeout and retries
  timeout = "10s"
  retries = 3

  ## Poll this block frequently - these are the values you need at fine
  ## granularity to reconstruct what happened during a power event.
  interval = "10s"

  ## Measurement name
  name = "snmp_ups_status"

  [inputs.snmp.tags]
    hostname = "hp-rt3000"

  #############################################
  ## OPERATING STATE (HP/Compaq CPQPOWER-MIB)
  #############################################
  [[inputs.snmp.field]]
    name = "output_source_code"
    oid = "1.3.6.1.4.1.232.165.3.4.5.0"
    # upsOutputSource: 1=other 2=off/none 3=normal(online) 4=bypass 5=battery
    # 6=booster 7=reducer 8=parallelCapacity 9=parallelRedundant 10=highEfficiencyMode

  [[inputs.snmp.field]]
    name = "load_percent"
    oid = "1.3.6.1.4.1.232.165.3.4.1.0"

  #############################################
  ## BATTERY (HP/Compaq CPQPOWER-MIB + standard UPS-MIB)
  #############################################
  [[inputs.snmp.field]]
    name = "battery_charge_percent"
    oid = "1.3.6.1.4.1.232.165.3.2.4.0"

  [[inputs.snmp.field]]
    name = "battery_abm_status_code"
    oid = "1.3.6.1.4.1.232.165.3.2.5.0"
    # upsBatteryAbmStatus: 1=charging 2=discharging 3=floating 4=resting 5=unknown

  [[inputs.snmp.field]]
    name = "battery_runtime_seconds"
    oid = "1.3.6.1.4.1.232.165.3.2.1.0"

  [[inputs.snmp.field]]
    name = "battery_voltage_volts"
    oid = "1.3.6.1.2.1.33.1.2.5.0"
    # Standard UPS-MIB upsBatteryVoltage, unit is 0.1V DC - CPQPOWER's own copy
    # of this value is whole volts only (coarser), so the standard MIB OID is
    # used here for one decimal place of resolution.
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "battery_current_amps"
    oid = "1.3.6.1.2.1.33.1.2.6.0"
    # Standard UPS-MIB upsBatteryCurrent, unit is 0.1A DC. Positive = discharging,
    # negative = recharging.
    conversion = "float(1)"

  #############################################
  ## ALARMS & MAINS-LOSS TIMER (standard UPS-MIB)
  ## CPQPOWER-MIB has no equivalent of either value.
  #############################################
  [[inputs.snmp.field]]
    name = "alarms_present"
    oid = "1.3.6.1.2.1.33.1.6.1.0"

  [[inputs.snmp.field]]
    name = "seconds_on_battery"
    oid = "1.3.6.1.2.1.33.1.2.2.0"


#############################################
## SNMP - UPS ELECTRICAL (input/output metering)
## Voltage, current, frequency, and power on both
## the input (mains) and output (protected) side.
## This UPS is single-phase, so all OIDs below are
## read directly at table index 1 rather than
## walked as a table.
#############################################
[[inputs.snmp]]
  agents = ["10.50.20.3:161"]
  version = 3
  sec_name = "readuser"
  sec_level = "authNoPriv"
  auth_protocol = "MD5"
  auth_password = "$UPS_SNMP_AUTH_PASSWORD"

  timeout = "10s"
  retries = 3
  interval = "20s"

  name = "snmp_ups_electrical"

  [inputs.snmp.tags]
    hostname = "hp-rt3000"

  #############################################
  ## INPUT (MAINS)
  #############################################
  [[inputs.snmp.field]]
    name = "input_voltage_volts"
    oid = "1.3.6.1.4.1.232.165.3.3.4.1.2.1"

  [[inputs.snmp.field]]
    name = "input_current_amps"
    oid = "1.3.6.1.2.1.33.1.3.3.1.4.1"
    # Standard UPS-MIB upsInputCurrent, unit 0.1A - CPQPOWER's own copy of this
    # value is whole amps only (coarser), so the standard MIB OID is used here.
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "input_frequency_hz"
    oid = "1.3.6.1.4.1.232.165.3.3.1.0"
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "input_realpower_watts"
    oid = "1.3.6.1.4.1.232.165.3.3.4.1.4.1"

  [[inputs.snmp.field]]
    name = "input_source_code"
    oid = "1.3.6.1.4.1.232.165.3.3.5.0"
    # upsInputSource: 1=other 2=none 3=primaryUtility 4=bypassFeed
    # 5=secondaryUtility 6=generator 7=flywheel 8=fuelcell

  #############################################
  ## OUTPUT (PROTECTED LOAD)
  #############################################
  [[inputs.snmp.field]]
    name = "output_voltage_volts"
    oid = "1.3.6.1.4.1.232.165.3.4.4.1.2.1"

  [[inputs.snmp.field]]
    name = "output_current_amps"
    oid = "1.3.6.1.2.1.33.1.4.4.1.3.1"
    # Standard UPS-MIB upsOutputCurrent, unit 0.1A - CPQPOWER's own copy of this
    # value is whole amps only (coarser), so the standard MIB OID is used here.
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "output_frequency_hz"
    oid = "1.3.6.1.4.1.232.165.3.4.2.0"
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "output_realpower_watts"
    oid = "1.3.6.1.4.1.232.165.3.4.4.1.4.1"
    # HP/Compaq CPQPOWER-MIB upsOutputWatts - REAL power in Watts.

  [[inputs.snmp.field]]
    name = "output_apparentpower_va"
    oid = "1.3.6.1.2.1.33.1.4.4.1.4.1"
    # Standard UPS-MIB upsOutputPower - APPARENT power in VA. Kept alongside
    # output_realpower_watts so true power factor (W / VA) can be derived in
    # Grafana. Neither MIB exposes an equivalent apparent-power value for the
    # input side, so no input_apparentpower field exists.


#############################################
## SNMP - UPS OUTLET SEGMENTS (HP/Compaq CPQPOWER-MIB)
## This UPS has 2 independently switchable/schedulable
## output segments (upsRecepTable).
#############################################
[[inputs.snmp]]
  agents = ["10.50.20.3:161"]
  version = 3
  sec_name = "readuser"
  sec_level = "authNoPriv"
  auth_protocol = "MD5"
  auth_password = "$UPS_SNMP_AUTH_PASSWORD"

  timeout = "10s"
  retries = 3
  interval = "30s"

  name = "snmp_ups_outlet"

  [inputs.snmp.tags]
    hostname = "hp-rt3000"

  [[inputs.snmp.table]]
    name = "snmp_ups_outlet"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "status_code"
      oid = "1.3.6.1.4.1.232.165.3.10.2.1.2"
      # upsRecepStatus: 1=on 2=off 3=pendingOff 4=pendingOn 5=unknown

    [[inputs.snmp.table.field]]
      name = "off_delay_seconds"
      oid = "1.3.6.1.4.1.232.165.3.10.2.1.3"
      # -1 = no shutdown currently pending for this segment

    [[inputs.snmp.table.field]]
      name = "on_delay_seconds"
      oid = "1.3.6.1.4.1.232.165.3.10.2.1.4"
      # -1 = no startup currently pending for this segment

    [[inputs.snmp.table.field]]
      name = "auto_off_delay_seconds"
      oid = "1.3.6.1.4.1.232.165.3.10.2.1.5"
      # configured delay before this segment auto-sheds after going on battery,
      # -1 = never auto-sheds

    [[inputs.snmp.table.field]]
      name = "auto_on_delay_seconds"
      oid = "1.3.6.1.4.1.232.165.3.10.2.1.6"
      # configured delay before this segment auto-restores after mains returns


#############################################
## SNMP - UPS IDENTITY & NOMINAL CONFIG (HP/Compaq CPQPOWER-MIB)
## Static/rarely-changing data: identification,
## nameplate ratings, and transfer voltage limits.
## Polled infrequently since it essentially never
## changes outside of a firmware or hardware swap.
#############################################
[[inputs.snmp]]
  agents = ["10.50.20.3:161"]
  version = 3
  sec_name = "readuser"
  sec_level = "authNoPriv"
  auth_protocol = "MD5"
  auth_password = "$UPS_SNMP_AUTH_PASSWORD"

  timeout = "10s"
  retries = 3
  interval = "300s"

  name = "snmp_ups_identity"

  [inputs.snmp.tags]
    hostname = "hp-rt3000"

  #############################################
  ## UPS IDENTITY
  #############################################
  [[inputs.snmp.field]]
    name = "manufacturer"
    oid = "1.3.6.1.4.1.232.165.3.1.1.0"

  [[inputs.snmp.field]]
    name = "model"
    oid = "1.3.6.1.4.1.232.165.3.1.2.0"

  [[inputs.snmp.field]]
    name = "ups_firmware_version"
    oid = "1.3.6.1.4.1.232.165.3.1.3.0"

  [[inputs.snmp.field]]
    name = "oem_code"
    oid = "1.3.6.1.4.1.232.165.3.1.4.0"
    # upsIdentOemCode - documented in CPQPOWER-MIB as "should be 0x0c for HP"

  [[inputs.snmp.field]]
    name = "serial_number"
    oid = "1.3.6.1.4.1.232.165.1.2.7.0"

  #############################################
  ## NETWORK MANAGEMENT CARD IDENTITY
  #############################################
  [[inputs.snmp.field]]
    name = "nmc_manufacturer"
    oid = "1.3.6.1.4.1.232.165.1.2.1.0"

  [[inputs.snmp.field]]
    name = "nmc_model"
    oid = "1.3.6.1.4.1.232.165.1.2.2.0"

  [[inputs.snmp.field]]
    name = "nmc_firmware_version"
    oid = "1.3.6.1.4.1.232.165.1.2.3.0"

  [[inputs.snmp.field]]
    name = "nmc_hardware_version"
    oid = "1.3.6.1.4.1.232.165.1.2.4.0"

  [[inputs.snmp.field]]
    name = "device_ident_name"
    oid = "1.3.6.1.4.1.232.165.1.2.5.0"

  [[inputs.snmp.field]]
    name = "nmc_part_number"
    oid = "1.3.6.1.4.1.232.165.1.2.6.0"

  [[inputs.snmp.field]]
    name = "nmc_mac_address"
    oid = "1.3.6.1.4.1.232.165.1.2.8.0"

  #############################################
  ## SELF-TEST RESULT
  #############################################
  [[inputs.snmp.field]]
    name = "test_result_code"
    oid = "1.3.6.1.4.1.232.165.3.7.2.0"
    # upsTestBatteryStatus: 1=unknown 2=passed 3=failed 4=inProgress
    # 5=notSupported 6=inhibited 7=scheduled

  #############################################
  ## NAMEPLATE / NOMINAL RATINGS & TRANSFER LIMITS
  #############################################
  [[inputs.snmp.field]]
    name = "nominal_output_voltage_volts"
    oid = "1.3.6.1.4.1.232.165.3.9.1.0"

  [[inputs.snmp.field]]
    name = "nominal_input_voltage_volts"
    oid = "1.3.6.1.4.1.232.165.3.9.2.0"

  [[inputs.snmp.field]]
    name = "nominal_output_power_watts"
    oid = "1.3.6.1.4.1.232.165.3.9.3.0"

  [[inputs.snmp.field]]
    name = "nominal_output_frequency_hz"
    oid = "1.3.6.1.4.1.232.165.3.9.4.0"
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "low_voltage_transfer_volts"
    oid = "1.3.6.1.4.1.232.165.3.9.6.0"
    # input voltage below which the UPS transfers to battery

  [[inputs.snmp.field]]
    name = "high_voltage_transfer_volts"
    oid = "1.3.6.1.4.1.232.165.3.9.7.0"
    # input voltage above which the UPS transfers to battery

  [[inputs.snmp.field]]
    name = "low_battery_runtime_minutes"
    oid = "1.3.6.1.2.1.33.1.9.7.0"
    # standard UPS-MIB upsConfigLowBattTime - device's own "low battery" runtime
    # warning threshold, used to drive the runtime gauge's critical threshold

  [[inputs.snmp.field]]
    name = "outlet_count"
    oid = "1.3.6.1.4.1.232.165.3.10.1.0"
